[package]
name = "ravansanj-sanati"
version = "2.1.0"
description = "سامانه چندرایانه‌ای آزمون‌های روان‌شناختی محیط کار"
authors = ["Ravansanj Sanati"]
edition = "2021"

[lib]
name = "ravansanj_sanati_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-localhost = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
