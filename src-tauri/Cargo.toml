[package]
name = "ravansanj-sanati"
version = "4.0.0"
description = "سامانه چندرایانه‌ای آزمون‌های روان‌شناختی محیط کار"
authors = ["Ravansanj Sanati"]
edition = "2021"

[lib]
name = "ravansanj_sanati_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-localhost = "2"
